name: Create PR to main

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pull request (no merge)
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # Evita duplicar um PR já aberto desta branch para main.
          if gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "Já existe um pull request aberto de $BRANCH_NAME para main."
            exit 0
          fi

          # Garante que existem commits a propor em relação a main.
          git fetch origin main
          if [ "$(git rev-list --count "origin/main..HEAD")" -eq 0 ]; then
            echo "Não há commits a propor de $BRANCH_NAME para main."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --fill
