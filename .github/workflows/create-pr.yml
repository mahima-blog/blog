name: Create PR to main

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq 'length' | grep -qv '^0$'; then
            echo "An open pull request from $BRANCH_NAME to main already exists."
            exit 0
          fi

          git fetch origin main
          if [ "$(git rev-list --count "origin/main..HEAD")" -eq 0 ]; then
            echo "No commits to propose from $BRANCH_NAME to main."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --fill
